<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg">

                <div class="card-header bg-dark text-white text-center">

                    <h2>✨ Create Your ALLURE Account</h2>

                    <p class="mb-0">
                        Join Allure and discover premium fashion.
                    </p>

                </div>

                <div class="card-body">

                    <div class="row">

                        <!-- First Name -->
                        <div class="col-md-6 mb-3">

                            <label>First Name</label>

                            <input
                                    id="firstName"
                                    class="form-control"
                                    type="text">

                        </div>

                        <!-- Last Name -->
                        <div class="col-md-6 mb-3">

                            <label>Last Name</label>

                            <input
                                    id="lastName"
                                    class="form-control"
                                    type="text">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label>Username</label>

                        <input
                                id="username"
                                class="form-control"
                                type="text">

                    </div>

                    <div class="mb-3">

                        <label>Email</label>

                        <input
                                id="email"
                                class="form-control"
                                type="email">

                    </div>

                    <div class="mb-3">

                        <label>Phone Number</label>

                        <input
                                id="phone"
                                class="form-control"
                                type="text">

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
                                id="password"
                                class="form-control"
                                type="password">

                    </div>

                    <div class="mb-3">

                        <label>Confirm Password</label>

                        <input
                                id="confirmPassword"
                                class="form-control"
                                type="password">

                    </div>

                    <div class="mb-3">

                        <label>Address</label>

                        <input
                                id="address"
                                class="form-control"
                                type="text">

                    </div>

                    <div class="row">

                        <div class="col-md-4">

                            <label>City</label>

                            <input
                                    id="city"
                                    class="form-control"
                                    type="text">

                        </div>

                        <div class="col-md-4">

                            <label>State</label>

                            <input
                                    id="state"
                                    class="form-control"
                                    type="text">

                        </div>

                        <div class="col-md-4">

                            <label>ZIP Code</label>

                            <input
                                    id="zip"
                                    class="form-control"
                                    type="text">

                        </div>

                    </div>

                    <div class="text-center mt-4">

                        <button
                                class="btn btn-dark btn-lg"
                                onclick="userService.register()">

                            Create Account

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
